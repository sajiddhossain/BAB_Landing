<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<title>BAB — Colpo alla testa</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../css/bab-scrapbook.css">
<link rel="stylesheet" href="../css/print.css">
<style>
  @page { size: A4; margin: 0; }
  body { font-size: 11px; line-height: 1.28; }
  .op { padding: 11mm 13mm 9mm; display: flex; flex-direction: column; height: 297mm; box-sizing: border-box; gap: 2.6mm; }
  .head { display:flex; align-items:center; justify-content:space-between; }
  .head img { height: 30px; }
  h1 { font-size: 34px; margin: 4px 0 0; color: var(--lime); }
  h1 .hl { color: #fff; }
  .lead { font-size: 13px; margin: 0; max-width: 175mm; }
  .box { background:#fff; border:3px solid var(--ink); box-shadow:5px 5px 0 0 var(--ink); padding: 9px 13px 10px; }
  .box h2 { font-size: 17px; margin: 0 0 5px; }
  .box ul { margin: 0; padding-left: 17px; }
  .box li { margin: 1.5px 0; }
  .red { background: var(--peach); box-shadow:5px 5px 0 0 var(--coral); }
  .red ul { columns: 2; column-gap: 8mm; }
  .red h2 { color: var(--ink); }
  .note { margin: 6px 0 0; font-weight: 600; }
  .row { display:grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
  .band { background: var(--deepteal); color:#fff; border:3px solid var(--ink); box-shadow:5px 5px 0 0 var(--yellow); padding: 9px 13px; }
  .band h2 { color: var(--lime); font-size: 16px; margin:0 0 3px; }
  .band p { margin:0; }
  .stats { display:grid; grid-template-columns: 1fr 1fr; gap: 6mm; }
  .stat { background:#fff; border:3px solid var(--ink); box-shadow:5px 5px 0 0 var(--ink); padding:8px 12px; display:flex; gap:10px; align-items:center; }
  .stat .num { font-family: var(--font-display); font-weight:900; font-size: 26px; white-space:nowrap; color: var(--sky); -webkit-text-stroke: 1.5px var(--ink); text-shadow:3px 3px 0 var(--ink); }
  .stat .lab { font-size: 11px; font-weight:700; color: rgba(15,15,18,.78); }
  .tool { margin:0; font-size: 12px; }
  .foot { margin-top:auto; border-top:3px solid var(--ink); padding-top: 7px; font-size: 10px; color: rgba(15,15,18,.75); }
  .foot p { margin: 2px 0; }
  .foot .links { display:flex; justify-content:space-between; gap: 8mm; font-size: 10.5px; color: var(--ink); margin-bottom: 4px; }
  .op p, .op li { font-size: 13.5px !important; line-height: 1.34 !important; }
  .op .lead { font-size: 15px !important; }
  .op .foot p { font-size: 9.5px !important; }
  .op .stat .lab { font-size: 12px !important; }
  .op .box h2 { font-size: 19px; }
  .op .box li { margin: 3px 0; }
</style>
</head>
<body class="fmt-a4">
<div class="page"><div class="op">
  <div class="head">
    <img src="../assets/logo/BAB_logo.svg" alt="BAB">
    <span class="pill"><span style="width:11px;height:11px;border-radius:999px;border:2px solid var(--ink);background:var(--coral);display:inline-block"></span>{{pill}}</span>
  </div>
  <div>
    <span class="eyebrow">{{eyebrow}}</span>
    <h1 class="title-stroke">{{title}}</h1>
  </div>
  <p class="lead">{{lead}}</p>
  <div class="box red">
    <h2>{{s1}}</h2>
    <p style="margin:0 0 4px">{{s1lead}}</p>
    <ul>{{s1items}}</ul>
    <p class="note">{{s1note}}</p>
  </div>
  <div class="row">
    <div class="box"><h2>{{s2}}</h2><ul>{{s2items}}</ul></div>
    <div class="box" style="box-shadow:5px 5px 0 0 var(--yellow)"><h2>{{s3}}</h2><ul>{{s3items}}</ul></div>
  </div>
  <div class="band"><h2>{{after}}</h2><p>{{aftertext}}</p></div>
  <div class="stats">
    <div class="stat"><span class="num">{{st1n}}</span><span class="lab">{{st1l}}</span></div>
    <div class="stat"><span class="num">{{st2n}}</span><span class="lab">{{st2l}}</span></div>
  </div>
  <p class="tool">{{tool}}</p>
  <div class="foot">
    <div class="links"><span>{{more}} <strong>{{url}}</strong></span><span>{{survey}}</span></div>
    <p>{{src}}</p>
    <p>{{disc}} © BAB · Breaking All Barriers</p>
  </div>
</div></div>
</body>
</html>
